name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install -U pip pytest
      - run: cd python && PYTHONPATH=src pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - run: cd web && npm install
      - run: cd web && npm run build

  interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Go encoder to Python decoder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/source.bin').write_bytes((b'SAFAST cross-language vector\n' * 4096))
          PY
          go run ./cmd/safast-pack -block-bytes 512 /tmp/source.bin > /tmp/frames.ndjson
          PYTHONPATH=python/src python -m safast.cli decode-ndjson /tmp/frames.ndjson --output /tmp/received
          cmp /tmp/source.bin /tmp/received/source.bin
