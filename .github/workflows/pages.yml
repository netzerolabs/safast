name: Deploy SAFAST to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
      - "AUTHORS.md"
      - "NOTICE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build SAFAST web application
        working-directory: web
        run: npm run build

      - name: Add project developer credit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("web/dist/index.html")
          html = page.read_text(encoding="utf-8")
          credit = '<span class="developer-credit">Developed by Long Ngo</span>'
          if credit not in html:
              if "</footer>" not in html:
                  raise SystemExit("footer marker not found in built HTML")
              html = html.replace("</footer>", f"{credit}</footer>", 1)
              page.write_text(html, encoding="utf-8")
          PY

      - name: Disable Jekyll processing
        run: touch web/dist/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    # The repository's legacy `github-pages` environment currently rejects
    # the default branch. A dedicated environment avoids that stale rule while
    # retaining GitHub's OIDC-backed Pages deployment validation.
    environment:
      name: safast-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
